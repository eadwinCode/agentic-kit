name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and inspect without publishing'
        type: boolean
        default: true

# id-token lets npm attach a provenance statement, so the published tarball
# can be traced back to this workflow and commit.
permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Publish the nested Go module tag.
      id-token: write

    # The same Postgres CI uses. The suite fails loudly without it rather than
    # skipping — which is right, and is why the first v0.1.0 run stopped before
    # publishing anything.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: agentic_admin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_ADMIN_PG: postgresql://postgres:password@localhost:5432/agentic_admin_test

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/go-agentenkit/go.mod
          cache-dependency-path: packages/go-agentenkit/go.sum

      # Writes the .npmrc that NODE_AUTH_TOKEN below fills in.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: bun install --frozen-lockfile

      # A tag that disagrees with package.json publishes the wrong version
      # under the right name, which cannot be undone — npm forbids reusing a
      # version even after unpublish.
      - name: Check the tag matches the package versions
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for pkg in packages/agentenkit packages/use-agentenkit; do
            version=$(node -p "require('./$pkg/package.json').version")
            if [ "$version" != "$tag" ]; then
              echo "::error::$pkg is $version but the tag is v$tag"
              exit 1
            fi
          done
          echo "both packages are $tag"

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # lib/pq wants sslmode spelled out against the plain service container,
      # and the Go suite fails loudly rather than skipping when it cannot
      # connect. Same URL the CI workflow's Go job uses.
      - name: Test Go module
        working-directory: packages/go-agentenkit
        env:
          TEST_ADMIN_PG: postgres://postgres:password@localhost:5432/agentic_admin_test?sslmode=disable
        run: go test -race -count=1 ./...

      - name: Test Go release tagging
        run: bash .github/scripts/test-publish-go-tag.sh

      - name: Build
        run: bun run build

      # The published tarball must be importable, not merely compilable.
      - name: Verify the packages import from a clean install
        run: bash .github/scripts/verify-package.sh

      # Go modules in subdirectories require a path-prefixed tag. Publish it
      # before npm so a partially published npm release cannot block a retry.
      - name: Publish Go module tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash .github/scripts/publish-go-tag.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"

      - name: Publish agentenkit
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: packages/agentenkit
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish use-agentenkit
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: packages/use-agentenkit
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Manual runs stop here: pack both and show what would ship.
      - name: Dry run — what would be published
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          for pkg in packages/agentenkit packages/use-agentenkit; do
            echo "--- $pkg"
            (cd "$pkg" && npm pack --dry-run)
          done
