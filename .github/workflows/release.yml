name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and inspect without publishing'
        type: boolean
        default: true

# id-token lets npm attach a provenance statement, so the published tarball
# can be traced back to this workflow and commit.
permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Writes the .npmrc that NODE_AUTH_TOKEN below fills in.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: bun install --frozen-lockfile

      # A tag that disagrees with package.json publishes the wrong version
      # under the right name, which cannot be undone — npm forbids reusing a
      # version even after unpublish.
      - name: Check the tag matches the package versions
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for pkg in packages/agentic-kit packages/use-agentkit; do
            version=$(node -p "require('./$pkg/package.json').version")
            if [ "$version" != "$tag" ]; then
              echo "::error::$pkg is $version but the tag is v$tag"
              exit 1
            fi
          done
          echo "both packages are $tag"

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # The published tarball must be importable, not merely compilable.
      - name: Verify the packages import from a clean install
        run: bash .github/scripts/verify-package.sh

      - name: Publish @agentic-kit/core
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: packages/agentic-kit
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish use-agentkit
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: packages/use-agentkit
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Manual runs stop here: pack both and show what would ship.
      - name: Dry run — what would be published
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          for pkg in packages/agentic-kit packages/use-agentkit; do
            echo "--- $pkg"
            (cd "$pkg" && npm pack --dry-run)
          done
