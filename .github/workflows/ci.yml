name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: packages (bun ${{ matrix.bun }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # A pinned leg for reproducibility, plus `latest` to catch drift.
        #
        # 1.4.0 rather than something older: bun.lock is the text lockfile,
        # which needs Bun 1.2+, and the test suite's mock model comes from
        # `ai/test`, which imports HTTPParser from node:http — absent from
        # Bun 1.2.0's shim, so every test file failed to load there. 1.4.0 is
        # the oldest version this suite is known to pass on.
        bun: ['1.4.0', 'latest']

    # The admin store's Postgres path is tested for real rather than skipped.
    # Without this the suite fails loudly by design — an unreachable database
    # used to pass with zero assertions, which is worse than a red build.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: agentic_admin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_ADMIN_PG: postgresql://postgres:password@localhost:5432/agentic_admin_test

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # The published package must be importable, not merely compilable. The
      # export map once pointed at paths the build never produced, and only a
      # real install would have caught it.
      - name: Pack and import as a consumer
        run: bash .github/scripts/verify-package.sh

  example:
    name: example app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      # Typecheck needs the generated client; no database is contacted.
      - name: Generate Prisma client
        working-directory: examples/nextjs-app
        run: bunx prisma generate

      - name: Typecheck the example
        working-directory: examples/nextjs-app
        run: bunx tsc --noEmit

      - name: Build the Go example's SPA
        run: bun run --cwd examples/go-app/web build

  go:
    name: go-agentenkit (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum the module declares, plus the current release to catch drift.
        go: ['1.25', 'stable']

    # The Postgres store and storage adapter are tested for real, like the
    # TypeScript suite: an unreachable database skips loudly rather than
    # passing with zero assertions.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: agentic_admin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_ADMIN_PG: postgres://postgres:password@localhost:5432/agentic_admin_test?sslmode=disable

    defaults:
      run:
        working-directory: packages/go-agentenkit

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: packages/go-agentenkit/go.sum

      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      # The Go example must keep compiling against the package.
      - name: Build the Go example
        working-directory: examples/go-app
        run: go vet ./... && go build -o /dev/null .
